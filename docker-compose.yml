services:
  app:
    build: .
    image: ${CONTAINER_NAME}:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT}:3000"
    environment:
      - TZ=America/Bogota
    # Endurecimiento del contenedor
    user: "node"
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
